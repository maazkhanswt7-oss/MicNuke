name: Build APK

# Builds the MicNuke APK in the cloud every time you push to main,
# or manually from the "Actions" tab (Run workflow button).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # lets you click "Run workflow" manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set +o pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using Android SDK at $SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.4/bin" >> $GITHUB_PATH
          gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MicNuke-debug-apk
          path: app/build/outputs/apk/debug/*.apk
